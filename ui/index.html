<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Balance</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Kept here so the proven card stylesheet stays untouched. */
      .widget[data-refreshing="true"] .count {
        opacity: 0.5;
      }
      /* The grip glyph is 11-13px, which is a hard target on a 200px card: a press
         near the corner missed it and started a window move instead. The hit area is
         therefore larger than the glyph. The marker still appears only on hover, so
         the card looks exactly the same. */
      .grip {
        right: 0;
        bottom: 0;
        width: 22px;
        height: 22px;
      }
      /* With the card locked there is nothing to grab, so the marker goes away. */
      .widget[data-draggable="false"] .grip {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- One card: the wallet balance, what the last stretch cost, and when it was
         read. Clicking the card reads the wallet again -- that is the ONLY time the
         widget touches the network. Everything else lives behind the gear.
         The card fills the window, which lets the host blur the desktop behind it
         and clip its shape to a rounded rectangle. -->
    <main class="widget" id="widget" data-mode="no_key" data-glass="clear">
      <section class="card" id="card">
        <span class="tint" aria-hidden="true"></span>

        <header class="card-head">
          <p class="badge" id="badge" role="status" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="badge-label">NO READING</span>
          </p>
          <div class="tools">
            <button class="icon-btn" id="btn-settings" type="button" aria-expanded="false"
                    title="Settings" aria-label="Settings">
              <svg class="gear" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <button class="icon-btn" id="btn-hide" type="button" title="Hide to tray" aria-label="Hide to tray">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" /></svg>
            </button>
            <button class="icon-btn" id="btn-quit" type="button" title="Quit" aria-label="Quit">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2" /></svg>
            </button>
          </div>
        </header>

        <p class="count">
          <span class="digits" id="balance">--</span>
          <span class="suffix" id="currency">&nbsp;</span>
        </p>

        <div class="foot">
          <span class="arrow" id="foot-arrow" aria-hidden="true">&#8635;</span>
          <span id="foot-line">Loading&hellip;</span>
        </div>

        <div class="sheet" id="sheet" hidden>
          <button class="sheet-close" id="sheet-close" type="button" title="Close settings"
                  aria-label="Close settings">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2" /></svg>
          </button>
          <p class="sheet-label">Settings</p>
          <div class="switches">
            <button class="switch" id="sw-on-top" type="button" role="switch" aria-checked="true"
                    title="Keep the widget above other windows">Always on top</button>
            <button class="switch" id="sw-autostart" type="button" role="switch" aria-checked="false"
                    title="Launch the widget when Windows starts">Start with Windows</button>
            <button class="switch" id="sw-notify" type="button" role="switch" aria-checked="true"
                    title="Windows notification when the balance runs out">Notify</button>
            <button class="switch" id="sw-glass" type="button" role="switch" aria-checked="true"
                    title="Blur the desktop behind the card">Glass</button>
            <button class="switch" id="sw-draggable" type="button" role="switch" aria-checked="true"
                    title="Untick to lock the card in place: no moving and no resizing">Draggable</button>
          </div>
        </div>

        <!-- Drag anywhere on the card to move it; drag this to resize. Both
             gestures are performed natively by the host (see app.py _gesture). -->
        <span class="grip" id="grip" title="Drag to resize">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M15 9L9 15M15 13l-2 2" />
          </svg>
        </span>
      </section>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
